name: Build Android APK (ARTALIBAS CORE 942)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies & build web app
        run: |
          npm install
          npm run build

      - name: Wrap into Android Capacitor project & generate adaptive icons
        run: |
          npm install --no-save @capacitor/core @capacitor/cli @capacitor/android
          if [ ! -f capacitor.config.json ] && [ ! -f capacitor.config.ts ]; then
            npx cap init "ARTALIBAS CORE 942" "id.yonif942.artalibas" --web-dir=dist
          fi
          npx cap add android
          mkdir -p assets
          cp public/pwa-maskable-512x512.png assets/icon-only.png
          cp .github/assets/icon-foreground.png assets/icon-foreground.png
          cp .github/assets/icon-background.png assets/icon-background.png
          cp public/pwa-maskable-512x512.png assets/splash.png
          cp public/pwa-maskable-512x512.png assets/splash-dark.png
          npx --yes @capacitor/assets generate --android --iconBackgroundColor '#ffffff' --iconBackgroundColorDark '#ffffff' --splashBackgroundColor '#0b141a' --splashBackgroundColorDark '#0b141a'
          npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../ARTALIBAS-CORE-942.apk

      - name: Upload ARTALIBAS-CORE-942.apk artifact
        uses: actions/upload-artifact@v4
        with:
          name: ARTALIBAS-CORE-942-APK
          path: ARTALIBAS-CORE-942.apk
